# ===================================================================
#  Decap CMS – Konfiguration für JazzyBunny Studios
#
#  WICHTIG: Nach jeder Änderung an dieser Datei die Versionsnummer in
#  admin/index.html hochzählen (config.yml?v=5 -> ?v=6). Sonst arbeitet
#  der Browser bis zu zehn Minuten mit der alten Fassung weiter.
# ===================================================================

backend:
  name: github
  repo: jazzybunnystudios/jazzybunny.github.io
  branch: main
  base_url: https://decap-oauth.jazzybunny.workers.dev
  auth_endpoint: auth

# Lokales Testen: `npx decap-server` starten, dann localhost öffnen.
# Auf der Live-Seite wird diese Einstellung ignoriert.
local_backend: true

locale: de

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://jazzybunny-studios.com
display_url: https://jazzybunny-studios.com
show_preview_links: false

collections:
  # =================================================================
  #  1. Objekte
  # =================================================================
  - name: gallery
    label: Galerie
    label_singular: Galerie
    delete: false
    editor:
      preview: false
    files:
      - name: items
        label: Objekte
        file: content/gallery.json
        format: json
        description: >-
          Deine Objekte. Per Drag & Drop sortierbar – die Reihenfolge hier ist
          auch die Reihenfolge auf der Webseite.
        fields:
          - label: Objekte
            name: items
            widget: list
            label_singular: Objekt
            collapsed: true
            summary: "{{fields.title}}  ·  {{fields.category}}"
            fields:
              - label: Hauptbild
                name: image
                widget: image
                hint: Wird als Vorschaubild in der Galerie angezeigt. Hochformat wirkt am besten.

              - label: Titel
                name: title
                widget: string

              - label: Produkt-ID
                name: product_id
                widget: string
                required: false
                hint: >-
                  Deine eigene Nummer oder Kennung, z. B. "JB-042" oder
                  "VASE-01". Erscheint in der Detailansicht bei den Angaben
                  und lässt sich über die Suche finden. Leer lassen = wird
                  nicht angezeigt.

              - label: Kategorie
                name: category
                widget: string
                required: false
                hint: >-
                  z. B. "Figuren", "Deko", "Ersatzteile". Aus den Kategorien
                  entstehen automatisch die Filter-Knöpfe und die
                  Kategorie-Kacheln auf der Startseite.

              - label: NSFW
                name: nsfw
                widget: boolean
                default: false
                required: false
                hint: >-
                  An = Bild wird unscharf angezeigt, mit NSFW-Kennzeichen
                  neben dem Titel. Besucher decken es selbst auf.

              - label: Neu
                name: is_new
                widget: boolean
                default: false
                required: false
                hint: >-
                  An = grünes Schild "Neu" oben links auf dem Bild und in der
                  Detailansicht. Einfach wieder ausschalten, wenn das Objekt
                  nicht mehr neu ist.

              - label: Highlight auf der Startseite
                name: featured
                widget: boolean
                default: false
                required: false
                hint: An = erscheint zusätzlich oben im Abschnitt "Highlights".

              - label: Aufkleber
                name: badge
                widget: select
                required: false
                options:
                  - Bestseller
                  - Limitiert
                  - Einzelstück
                  - Auf Anfrage
                  - Nicht verfügbar
                hint: >-
                  Zweites Schild neben "Neu", in der Akzentfarbe. Leer lassen
                  = keins. Beide lassen sich kombinieren.

              - label: Beschreibung
                name: description
                widget: text
                required: false

              # --- Angaben für die Detailansicht ---
              - label: Material
                name: material
                widget: string
                required: false
                hint: 'z. B. "PLA", "PETG", "Resin"'

              - label: Maße
                name: size
                widget: string
                required: false
                hint: 'z. B. "12 × 8 × 20 cm"'

              - label: Farben
                name: colors
                widget: string
                required: false
                hint: 'z. B. "Schwarz, Rot, Weiß" – frei wählbar'

              - label: Druckzeit
                name: print_time
                widget: string
                required: false
                hint: 'z. B. "ca. 14 Stunden"'

              - label: Verfügbarkeit
                name: status
                widget: string
                required: false
                hint: 'z. B. "Auf Lager", "Fertigung 3–5 Tage", "Nur auf Bestellung"'

              - label: Preis-Hinweis
                name: price_note
                widget: string
                required: false
                hint: >-
                  Reine Textangabe, z. B. "ab 25 €" oder "Preis auf Anfrage".
                  Es gibt keinen Warenkorb – Bestellungen laufen über den Kontakt.

              - label: Weitere Bilder
                name: gallery
                widget: list
                required: false
                collapsed: true
                summary: Zusatzbild
                fields:
                  - label: Bild
                    name: image
                    widget: image

  # =================================================================
  #  2. Startseite
  # =================================================================
  - name: home
    label: Startseite
    delete: false
    editor:
      preview: false
    files:
      - name: page
        label: Aufbau der Startseite
        file: content/home.json
        format: json
        description: Bühne, Abschnittsüberschriften, Kennzahlen und FAQ.
        fields:
          # --- Bühne ---
          - label: Hintergrundbild der Bühne
            name: hero_image
            widget: image
            required: false
            hint: >-
              Großes Bild hinter dem Logo ganz oben. Wird automatisch
              abgedunkelt, damit Schrift lesbar bleibt. Leer lassen = schlicht.

          - label: Überschrift
            name: hero_title
            widget: string
            required: false
            hint: >-
              Die große Schlagzeile auf der Bühne. Leer lassen übernimmt den
              Seitentitel aus den Einstellungen.

          - label: Unterzeile
            name: hero_subtitle
            widget: text
            required: false
            hint: Leer lassen übernimmt den Text aus Einstellungen → "Über dich".

          - label: Knopf-Beschriftung
            name: hero_cta_text
            widget: string
            required: false
            default: Zur Galerie

          - label: Knopf-Ziel
            name: hero_cta_link
            widget: string
            required: false
            default: "#katalog"
            hint: '"#katalog", "#kontakt" oder eine volle Adresse.'

          # --- Kennzahlen ---
          - label: Kennzahlen-Streifen
            name: stats
            widget: list
            required: false
            collapsed: true
            label_singular: Kennzahl
            summary: "{{fields.value}} – {{fields.label}}"
            hint: >-
              Schmaler Balken unter der Bühne, z. B. "120 · Objekte gedruckt".
              Leer lassen blendet ihn aus.
            fields:
              - label: Zahl
                name: value
                widget: string
              - label: Beschriftung
                name: label
                widget: string

          # --- Überschriften ---
          - label: Überschrift "Kategorien"
            name: cat_title
            widget: string
            required: false
            default: Kategorien

          - label: Überschrift "Highlights"
            name: featured_title
            widget: string
            required: false
            default: Highlights

          - label: Überschrift "Galerie"
            name: catalog_title
            widget: string
            required: false
            default: Galerie

          # --- FAQ ---
          - label: Überschrift "FAQ"
            name: faq_title
            widget: string
            required: false
            default: Häufige Fragen

          - label: Häufige Fragen
            name: faq
            widget: list
            required: false
            collapsed: true
            label_singular: Frage
            summary: "{{fields.question}}"
            hint: Leer lassen blendet den ganzen FAQ-Abschnitt aus.
            fields:
              - label: Frage
                name: question
                widget: string
              - label: Antwort
                name: answer
                widget: text

          # --- Kontaktabschnitt ---
          - label: Überschrift "Kontakt"
            name: contact_title
            widget: string
            required: false
            default: Kontakt

          - label: Text im Kontaktabschnitt
            name: contact_text
            widget: text
            required: false

  # =================================================================
  #  3. Einstellungen
  # =================================================================
  - name: settings
    label: Einstellungen
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: Seite & Kontakt
        file: content/settings.json
        format: json
        fields:
          # --- Sperre ---
          - label: Seite gesperrt
            name: maintenance
            widget: boolean
            default: false
            hint: >-
              An = Besucher sehen statt der Galerie einen Hinweis. Der
              Admin-Bereich bleibt erreichbar. Achtung: Hinweisschild, keine
              Zugangssperre – direkt aufgerufene Bilddateien bleiben abrufbar.

          - label: Text bei gesperrter Seite
            name: maintenance_title
            widget: string
            required: false
            default: Wir sind derzeit nicht erreichbar

          - label: Zusatztext bei gesperrter Seite
            name: maintenance_text
            widget: text
            required: false

          # --- Ankündigungsleiste ---
          - label: Ankündigungsleiste anzeigen
            name: announce_on
            widget: boolean
            default: false
            required: false
            hint: Farbiger Balken ganz oben, z. B. für Aktionen oder Urlaubszeiten.

          - label: Text der Ankündigung
            name: announce_text
            widget: string
            required: false

          - label: Ziel der Ankündigung
            name: announce_link
            widget: string
            required: false
            hint: Optional. Macht den Balken anklickbar, z. B. "#katalog".

          # --- Identität ---
          - label: Seitentitel
            name: title
            widget: string

          - label: Untertitel
            name: tagline
            widget: string
            required: false
            hint: Kleine Zeile unter dem Namen in der Kopfzeile.

          - label: Über dich
            name: about
            widget: text
            required: false
            hint: Erscheint auf der Bühne und in der Fußzeile.

          - label: Logo (Wortmarke)
            name: logo
            widget: image
            required: false
            hint: >-
              Steht oben links in der Kopfzeile, in der Fußzeile und auf der
              Sperrseite. Querformat mit transparentem Hintergrund, etwa
              10:1 breit zu hoch. Weiße Schrift wird im hellen Design
              automatisch dunkel eingefärbt – das klappt nur bei einfarbigen
              Logos. Leer lassen zeigt stattdessen den Seitentitel als Text.

          - label: Akzentfarbe
            name: accent
            widget: color
            required: false
            default: "#e03a45"
            allowInput: true
            hint: Farbe für Knöpfe, Aufkleber und Überschriften-Striche.

          # --- Kontakt ---
          - label: WhatsApp
            name: whatsapp
            widget: string
            required: false
            hint: >-
              Nummer mit Ländervorwahl (z. B. "+49 170 1234567") oder ein
              fertiger wa.me-Link. Ist das Feld gefüllt, führt der Knopf in
              der Detailansicht direkt zu WhatsApp statt zum Kontaktbereich.
              Zusätzlich erscheint unten rechts ein schwebender
              WhatsApp-Knopf.

          - label: WhatsApp-Nachricht (allgemein)
            name: whatsapp_text
            widget: string
            required: false
            hint: >-
              Steht schon im Chatfenster, wenn jemand den schwebenden Knopf
              unten rechts oder "WhatsApp" bei den Kontakten antippt.
              Leer lassen nimmt: "Hallo! Ich habe eine Frage."

          - label: WhatsApp-Nachricht (Bestellung)
            name: whatsapp_order_text
            widget: string
            required: false
            hint: >-
              Für den Bestellknopf am Objekt. Platzhalter werden ersetzt:
              {titel}, {id}, {preis}, {kategorie}. Leere Platzhalter und
              übrig gebliebene Klammern räume ich automatisch weg.
              Leer lassen nimmt:
              "Hallo! Ich möchte gerne bestellen: {titel} ({id})"

          - label: E-Mail
            name: email
            widget: string
            required: false
            hint: >-
              Rückfallebene für den Bestellknopf, falls keine WhatsApp-Nummer
              hinterlegt ist – dann öffnet er eine E-Mail mit dem Objektnamen
              im Betreff.

          - label: Instagram
            name: instagram
            widget: string
            required: false
            hint: Benutzername oder volle Adresse.

          - label: TikTok
            name: tiktok
            widget: string
            required: false

          - label: YouTube
            name: youtube
            widget: string
            required: false

          - label: Etsy-Shop
            name: etsy
            widget: string
            required: false

          - label: Discord-Widget
            name: discord
            widget: text
            required: false
            hint: >-
              Zeigt deinen Server im Kontaktbereich, mit Mitgliederliste und
              Beitreten-Knopf. Hier den kompletten Einbettungscode einfügen,
              die Widget-Adresse oder einfach nur die Server-ID – ich hole
              mir die Nummer selbst heraus. Den Code findest du in Discord
              unter Servereinstellungen → Widget; dort muss "Server-Widget
              aktivieren" eingeschaltet sein, sonst bleibt es leer.
              Beachte: Das Widget lädt bei jedem Seitenaufruf mit und
              übermittelt dabei die IP-Adresse der Besucher an Discord –
              Discord gehört deshalb in deine Datenschutzerklärung.
              Leer lassen blendet es aus.

          - label: Telefon
            name: phone
            widget: string
            required: false

          # --- Rechtliches ---
          - label: Impressum
            name: imprint
            widget: text
            required: false
            hint: >-
              In Deutschland für gewerbliche Seiten Pflicht (§ 5 DDG):
              Name, Anschrift, E-Mail. Leer lassen blendet den Link aus.

          - label: Datenschutzerklärung
            name: privacy
            widget: text
            required: false
            hint: Leer lassen blendet den Link aus.

          - label: Zusatz in der Fußzeile
            name: footer_note
            widget: string
            required: false
            hint: 'Optional, z. B. "Handgefertigt in Deutschland".'
